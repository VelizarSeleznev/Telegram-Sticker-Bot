name: Deploy to seggver

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-seggver
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - seggver
      - telegram-sticker-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Docker Compose stack
        run: ./scripts/deploy_seggver.sh
